rover:
  gateway:
    port: 80
    server:
      maxContentLengthBytes: 1048576
    proxy:
      connectTimeoutMillis: 3000
      requestTimeoutMillis: 30000
    filters:
      enabled: true
      pluginDir: plugins
      classes: []
    # 负载均衡（静态多 IP / Nameserver 动态实例共用）
    # round_robin | random | weighted_round_robin | ip_hash | least_connections
    # 也可填自定义类全名，或 plugins 里 SPI 的 name()
    loadbalance:
      strategy: round_robin
    # static: targetUrl / targetUrls，不连 Nameserver，多 IP 同样走上面的 LB
    # nameserver: 读下面 nameserver 配置并订阅 serviceName
    discovery:
      type: nameserver
      nameserver:
        address: 127.0.0.1:8888
        reconcileIntervalMs: 30000
    rewrite:
      stripPrefix: /api
    routes:
      # 动态发现：转发到 demo-service（Starter 自动注册）
      - id: demo-api
        businessPrefix: /api/demo
        serviceName: demo-service
        stripPrefix: /api/demo
      # 静态多上游示例（discovery.type=static 时启用）：
      # - id: demo-api
      #   businessPrefix: /api/demo
      #   targetUrls:
      #     - http://127.0.0.1:8081
      #     - http://127.0.0.1:8082|200
      #   stripPrefix: /api/demo
