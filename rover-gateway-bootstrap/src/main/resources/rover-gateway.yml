# 整个网关只连一种注册中心：static / nameserver / nacos。
# 选了 nameserver 或 nacos 后，个别路由仍可只写 targetUrls，走静态地址。
# 一条路由不要同时写 serviceName 和 targetUrl。
# 整机静态：deploy/docker/config/rover-gateway-static.yml
# Nacos：先 -Pnacos 打包，再看 deploy/docker/config/rover-gateway-nacos.yml
rover:
  gateway:
    port: 80
    # false 时不开放 /_manage/**，也不读 overlay，只认本 YAML
    adminEnabled: true
    # 非空时访问 /_manage/** 必须带 X-Rover-Admin-Token。留空=不鉴权（生产不要这样）
    adminToken: ""
    server:
      maxContentLengthBytes: 1048576
      bindHost: 0.0.0.0
      dispatchOnEventLoop: false
      ioTransport: auto
      # 不写或 0：默认 max(64, CPU×8)。超限回 503
      # maxInflight: 64
      # 入站 Keep-Alive 读空闲超时，闲着且没在处理请求才关。不写或 0=60
      # idleTimeoutSeconds: 60
      # 请求没收齐时，客户端多久不送字节就关连接。不写或 0=30
      # requestIdleTimeoutSeconds: 30
    metrics:
      enabled: true
      windowSeconds: 300
    trace:
      enabled: true
      slowThresholdMillis: 100
      sampleRate: 0.0
    proxy:
      # netty 只转发 http 上游；上游必须 https 时改 jdk
      outbound: netty
      # 下面这些不写或写 0 都用默认。连接池按「每条 EventLoop × 每个后端」计
      # connectTimeoutMillis: 3000
      # requestTimeoutMillis: 30000
      # maxConnectionsPerEventLoop: 64
      # maxPendingAcquires: 256
      # 出站池闲连接超时，没在转发才踢。不写或 0=60
      # idleTimeoutSeconds: 60
    filters:
      enabled: true
      pluginDir: plugins
      accessLog: true
      classes: []
    rateLimit:
      enabled: false
      algorithm: token_bucket
      key: path
      permitsPerSecond: 1000
      burst: 2000
      limit: 1000
      windowSeconds: 1
    circuitBreaker:
      enabled: false
      failureThreshold: 5
      openSeconds: 10
      recovery: all
    retry:
      enabled: false
    loadbalance:
      strategy: round_robin
    discovery:
      type: nameserver
      nameserver:
        address: 127.0.0.1:8888
        reconcileIntervalMs: 30000
        token: ""
    cors:
      enabled: true
      allowedOrigins:
        - "*"
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      allowedHeaders:
        - "*"
      credentials: false
      maxAgeSeconds: 1800
    routes:
      # 动态：按服务名找实例。demo 自带 /api 前缀，所以不剥
      - id: demo-api
        businessPrefix: /api
        serviceName: demo-service
        stripPrefix: ""

      # 动态模式下夹一条静态也可以，取消注释即可
      # - id: static-demo-api
      #   businessPrefix: /api/static
      #   targetUrls:
      #     - http://127.0.0.1:8081
      #     - http://127.0.0.1:8082|200
      #   stripPrefix: /api/static
