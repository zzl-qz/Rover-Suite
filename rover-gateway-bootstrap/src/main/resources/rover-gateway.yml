rover:
  gateway:
    port: 8080
    server:
      maxContentLengthBytes: 1048576
    proxy:
      connectTimeoutMillis: 3000
      requestTimeoutMillis: 30000
    filters:
      enabled: true
      pluginDir: plugins
      classes: []
    # static: 只用 targetUrl，不连 Nameserver
    # nameserver: 读下面 nameserver 配置并订阅 serviceName
    discovery:
      type: nameserver
      nameserver:
        address: 127.0.0.1:8888
        reconcileIntervalMs: 30000
    rewrite:
      stripPrefix: /api
    routes:
      # 动态发现：转发到 demo-service（Starter 自动注册）
      - id: demo-api
        businessPrefix: /api/demo
        serviceName: demo-service
        stripPrefix: /api/demo
      # 如需切回 static，把 discovery.type 改成 static，并给路由补 targetUrl，例如：
      # - id: demo-api
      #   businessPrefix: /api/demo
      #   targetUrl: http://127.0.0.1:8081
      #   stripPrefix: /api/demo
