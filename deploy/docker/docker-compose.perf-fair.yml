# Phase A 公平对照：demo 不被饿死，避免直连 P95/P99 脏尾巴
# 叙事：Docker Desktop 上的相对开销对照，不是 Linux SLA
# 合计约：CPU 5 / 内存 ~4.5G（GW 2 + NS 1 + demo 2）
services:
  nameserver:
    cpus: "1.0"
    mem_limit: 1g
    mem_reservation: 512m
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

  gateway:
    cpus: "2.0"
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"

  demo:
    cpus: "2.0"
    mem_limit: 1g
    mem_reservation: 512m
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0"
