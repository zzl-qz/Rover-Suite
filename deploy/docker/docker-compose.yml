services:
  nameserver:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.nameserver
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
    volumes:
      - ./config:/app/config:ro

  demo:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.demo
    restart: unless-stopped
    depends_on:
      - nameserver
    expose:
      - "8082"
    # 只挂 demo 配置；整目录挂载会把 Admin 的 application.yml 盖进来，导致连 127.0.0.1:8888
    volumes:
      - ./config/demo-application.yml:/app/config/application.yml:ro

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    restart: unless-stopped
    depends_on:
      - nameserver
      - demo
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./config:/app/config:ro
      - ./plugins:/app/plugins:ro

  admin:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.admin
    restart: unless-stopped
    depends_on:
      - gateway
      - nameserver
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./config:/app/config:ro
