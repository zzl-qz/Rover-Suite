# Phase A 对照：和 rover-gateway-static.yml 一样，只把出站切回第一版 JDK HttpClient
rover:
  gateway:
    port: 80
    adminEnabled: false
    adminToken: ""
    server:
      bindHost: 0.0.0.0
      dispatchOnEventLoop: false
    metrics:
      enabled: false
    trace:
      enabled: false
    proxy:
      outbound: jdk
      connectTimeoutMillis: 3000
      requestTimeoutMillis: 30000
    filters:
      enabled: true
      pluginDir: plugins
      accessLog: false
      classes: []
    rateLimit:
      enabled: false
    loadbalance:
      strategy: round_robin
    discovery:
      type: static
    cors:
      enabled: false
    routes:
      - id: demo-api-static
        businessPrefix: /api
        targetUrls:
          - http://demo:8082
        stripPrefix: ""
