# Rover Admin —— 小团队内网生产样例（Spring Boot application.yml）
# 复制到 Admin 使用的配置位置后替换 URL 与 token。
# Admin 只放运维网段，不要映射公网。
server:
  port: 9090

spring:
  application:
    name: rover-admin

rover:
  admin:
    gateway-url: http://10.0.10.12:80
    nameserver-manage-url: http://10.0.10.11:8889
    log-store-path: "${ROVER_ADMIN_LOG_STORE_PATH:./rover-logs/rover}"
    # 当前 Admin 只有一个管理 token，需与所管理的两端一致。
    admin-token: "REPLACE_WITH_LONG_GATEWAY_ADMIN_TOKEN"
