server:
  port: 9090
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ROVERADMIN_SESSION
        http-only: true
        same-site: strict

spring:
  application:
    name: rover-admin
  http:
    converters:
      preferred-json-mapper: jackson2
  ai:
    model:
      chat: ${ROVER_AGENT_MODEL_CHAT:none}
      embedding: none
    openai:
      api-key: ${ROVER_AGENT_API_KEY:}
      # 只在首次启动、尚无模型配置文件时用于播种；之后以控制台保存的配置为准
      base-url: ${ROVER_AGENT_BASE_URL:https://api.deepseek.com}
      timeout: 30s
      max-retries: 0
      chat:
        model: ${ROVER_AGENT_MODEL:deepseek-chat}
        parallel-tool-calls: false
      # 快速模型（可选）：承接目标解析/调查规划这类廉价调用，未配置则回退主模型
      fast-base-url: ${ROVER_AGENT_FAST_BASE_URL:}
      fast-model: ${ROVER_AGENT_FAST_MODEL:}
      fast-api-key: ${ROVER_AGENT_FAST_API_KEY:}
    tools:
      limits:
        # 工具调用预算：与 OpsTools.MAX_CALLS 对齐，两处都放开到够用为止。
        # 旧值（单工具 2 次 / 总计 6 次）是配「读预采集快照」那代工具定的，那时一轮几乎不用循环；
        # 现在的工具是真查询，一句话问三件事就要 3~6 次，稍多查两步就会被这个上限掐断——
        # 表现就是「问题稍微多一点就答不全」。
        max-calls-per-tool-default: 10
        max-total-tool-calls: 30
        on-limit-exceeded: THROW

# Admin 只调组件管理口，自己不持有真实配置
rover:
  agent:
    limits:
      # 每个任务共用：目标解析、重试、调查规划和工具循环都不重置预算。
      max-model-calls: 20
      max-output-tokens: 4096
      # 服务商未返回 usage 时按本地 tokenizer 估算；累计包含输入、输出和思考。
      max-total-tokens: 100000
      # 从 Worker 开始执行计时，持续输出不会延长时限。
      task-timeout-seconds: 180
      max-repeated-tool-results: 3
    context:
      # 上下文窗口：每次提问最多带上最近多少条会话消息；历史不会被无限制发给模型
      recent-message-limit: ${ROVER_AGENT_CONTEXT_MESSAGE_LIMIT:8}
  admin:
    gateway-url: http://127.0.0.1:80
    nameserver-manage-url: http://127.0.0.1:8889
    # 管理口鉴权 token：非空时，Admin 调用 Gateway/Nameserver 管理口会带上 X-Rover-Admin-Token
    # 需与 Gateway / Nameserver 的 adminToken 一致；留空=对端也不鉴权（仅本机调试）
    admin-token: ""

    # 落盘记录库（H2）：目录/文件缺失自动创建；本机运行数据，已在 .gitignore 忽略（rover-logs/、*.mv.db）。
    # 绝对路径钉死，换机器改这里；DB 文件 = rover-logs/rover.mv.db。
    log-store-path: e:/roverSuite/rover-admin/rover-logs/rover
    # 诊断证据类保留天数（配置变更/健康翻转/审计等，尽量不丢）；默认 30
    log-retention-days: 30
    # 遥测类保留天数（指标采样/慢链路等，量大，短保留防膨胀）；默认 3
    log-telemetry-retention-days: 3
    # 遥测采集间隔（秒）：周期拉取 Gateway/Nameserver 指标与慢链路写入落盘库；默认 30
    log-collect-interval-seconds: 30
    # 普通(遥测)队列容量：指标采样/慢链路量大，满则 best-effort 丢弃，绝不让业务等待；默认 8192
    log-queue-capacity: 8192
    # 高优(诊断证据)队列容量：配置变更/部署/错误等尽量不丢，满则短暂阻塞等待；默认 16384
    log-critical-capacity: 16384

    model:
      # 模型配置落盘位置；留空用工作目录下的 config/admin-model.properties
      # （整个 config/ 已在 .gitignore 中，文件缺失时启动自动创建空配置）
      config-file: ${ROVER_ADMIN_MODEL_CONFIG_FILE:}
      # 主密钥：base64 的 32 字节直接使用，否则按口令 PBKDF2 派生；留空则用主密钥文件
      master-key: ${ROVER_ADMIN_MASTER_KEY:}
      master-key-file: ${ROVER_ADMIN_MASTER_KEY_FILE:}

# 指标对外出口（可选，默认进程内 SimpleMeterRegistry，只供诊断）：
#   - 开启 export.prometheus.enabled=true 后，注册表切换为 PrometheusMeterRegistry，
#     由 /actuator/prometheus 供抓取；指标名与标签口径不变（rover.agent.*）。
#   - 同等可走 OTLP：management.otlp.metrics.export.enabled=true 并配置 endpoint。
# 指标注册表交由 Spring Boot 统一管理，Agent 运行层只通过端口取用，口径不受影响。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  metrics:
    export:
      prometheus:
        enabled: false
