<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Rover-Suite">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D9"/>
      <stop offset="100%" stop-color="#003BA8"/>
    </linearGradient>
  </defs>

  <!-- mark / icon -->
  <g transform="translate(20,20) scale(1.25)">
    <rect width="128" height="128" rx="26" fill="url(#bg2)"/>
    <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="34" y1="28" x2="34" y2="100"/>
      <line x1="34" y1="28" x2="60" y2="28"/>
      <path d="M60 28 Q88 28 88 52 Q88 72 60 72"/>
      <line x1="34" y1="72" x2="60" y2="72"/>
      <line x1="60" y1="72" x2="88" y2="100"/>
    </g>
    <g fill="#ffffff">
      <circle cx="34" cy="28" r="5"/>
      <circle cx="88" cy="52" r="4.5"/>
      <circle cx="60" cy="72" r="4"/>
      <circle cx="88" cy="100" r="5"/>
    </g>
    <g fill="#ffffff" opacity="0.35">
      <circle cx="68" cy="80" r="2"/>
      <circle cx="76" cy="88" r="2"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="210" y="108" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="62" font-weight="700" fill="#0052D9" letter-spacing="-1.5">Rover</text>
  <text x="390" y="108" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="62" font-weight="500" fill="#64748b" letter-spacing="-1">Suite</text>

  <!-- accent line -->
  <rect x="212" y="128" width="36" height="3" rx="1.5" fill="#0052D9"/>

  <!-- tagline -->
  <text x="210" y="160" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial" font-size="15" fill="#475569" letter-spacing="2.5" font-weight="500">LIGHTWEIGHT MICROSERVICE MIDDLEWARE</text>
</svg>