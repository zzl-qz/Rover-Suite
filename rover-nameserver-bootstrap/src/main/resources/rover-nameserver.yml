# Rover Nameserver 服务端配置文件
# 加载优先级：工作目录 config/rover-nameserver.yml（外部）> classpath 同文件 > 代码默认值
# 注意：本文件为「启动静态配置」，运行时热更新/Admin 修改的值会持久化到
# config/nameserver-runtime.overlay.json 并在重启后覆盖本文件对应项。
rover:
  nameserver:
    # TCP 注册/发现/订阅端口（客户端连接此端口）
    port: 8888
    # TCP 监听地址：默认 0.0.0.0 监听所有网卡；可收紧到 127.0.0.1 或内网 IP
    bindHost: 0.0.0.0
    # Admin 调这个 HTTP 管理口，不是 TCP 8888
    managePort: 8889
    # 管理口监听地址：默认 0.0.0.0；建议生产收紧到 127.0.0.1（配合防火墙）
    manageBindHost: 0.0.0.0
    # 集群协议鉴权 token：非空时，客户端注册/注销/订阅必须携带相同 token，否则回 401
    # 留空 = 关闭协议层鉴权（向后兼容）
    token: ""
    # 管理口鉴权 token：非空时，访问 /_manage/** 必须带 X-Rover-Admin-Token 请求头
    # 留空 = 关闭管理口鉴权（向后兼容）
    adminToken: ""
    # 心跳超时(ms)：超过则把实例标记为不健康（非临时实例）
    heartbeatTimeoutMillis: 15000
    # 健康检查扫描间隔(ms)
    healthCheckIntervalMillis: 5000
    # 临时实例过期时间(ms)：超过直接剔除出注册表
    instanceExpireMillis: 30000
    # 服务变更推送总开关（客户端 subscribe 后依赖此推送感知变更）
    pushEnabled: true
    # SINGLE / HALF / ALL
    writeAckMode: SINGLE
    # 是否允许客户端请求覆盖服务端 ACK 强度
    allowClientAckOverride: false
    # 集群配置（预留）：当前单机部署保持关闭
    cluster:
      enabled: false
      nodeId: ""
      nodes: []
      replicationFactor: 1